# Expectations for the coverage corpus. Read by tests/corpus.rs.
#
# Every .typ file under fixtures/corpus must be listed as a [[fixture]] or a
# [[support]] file. Support files are imported by fixtures and are not run directly.
#
# [[sentinel]] fields:
#   fixture         id of a [[fixture]] entry (its path without ".typ")
#   token           exact Unicode word (UAX 29) that must appear in the output
#   category        report grouping
#   kind            markup    authored markup, eligible wherever it is written
#                   string    string literal, displayed or not
#                   generated text produced by evaluation or layout, not written in the file
#                   non_prose identifier, label, comment, raw text, math or path
#   context         where the token sits in the fixture
#   rendered        true if the token is visible in the compiled document
#   source          expected presence in `typst-prose source` output
#   source_count    optional exact number of occurrences in source output
#   compiled        expected presence in `typst-prose compiled` output
#   compiled_count  optional exact number of occurrences in compiled output
#   reason          why the expectation holds (intended semantics, not current output)
#   known_source    set only when the source expectation is a documented extractor
#                   limitation; the mismatch is then reported as KNOWN, not a failure
#   known_compiled  same for the compiled expectation
#
# [[exact]] fields: expected is the complete stdout for that mode. A mismatch is a
# boundary or spacing failure. known works as for sentinels.
#
# Source mode: markup is extracted wherever it is written, including unexecuted code.
# Strings, generated text and non-prose are not extracted.
# Compiled mode: rendered text is extracted. Page furniture and footnote markers are
# excluded by contract. Non-prose rendered text (raw, math) is not prose, so the
# expectation is false and any extraction of it is a known limitation.

