[package]
name = "typst-prose"
version = "0.1.0"
edition = "2024"
description = "Extract natural-language prose from Typst documents."
license = "Unlicense"
repository = "https://github.com/5cover/typst-prose"
readme = "README.md"
keywords = ["typst", "prose", "text-extraction"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-syntax = "=0.15.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
typst-kit = { version = "=0.15.1", default-features = false, features = ["datetime", "embedded-fonts", "scan-fonts", "system-packages"] }
chrono = { version = "=0.4.45", default-features = false }
rayon = "=1.12.0"
unicode-normalization = "=0.1.26"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
unicode-segmentation = "1.13.3"
